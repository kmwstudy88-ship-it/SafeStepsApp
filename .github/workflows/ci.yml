name: SafeSteps CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-output.log

      - name: Route hygiene audit
        run: npm run audit:routes

      - name: Verify document intelligence pipeline
        run: npm run verify:documents

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            tsc-output.log
            test-output.log
          if-no-files-found: ignore
          retention-days: 7
