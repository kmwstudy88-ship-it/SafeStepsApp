name: Resilience Schema Verify

on:
  pull_request:
    paths:
      - 'schema/resilience-learning-observations-schema.json'
      - 'lessons/lesson_building_resilience_master.json'
      - 'tools/tests/resilience-learning-observations-schema.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resilience-schema-verify.yml'
  push:
    branches: [main]
    paths:
      - 'schema/resilience-learning-observations-schema.json'
      - 'lessons/lesson_building_resilience_master.json'
      - 'tools/tests/resilience-learning-observations-schema.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resilience-schema-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Validate resilience observation definitions
        run: npm run test:resilience-schema
