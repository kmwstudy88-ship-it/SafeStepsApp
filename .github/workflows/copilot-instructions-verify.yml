name: Copilot Instructions Verify

on:
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - 'tools/tests/copilot-instructions.test.mjs'
      - '.github/workflows/copilot-instructions-verify.yml'
  push:
    branches: [main]
    paths:
      - '.github/copilot-instructions.md'
      - 'tools/tests/copilot-instructions.test.mjs'
      - '.github/workflows/copilot-instructions-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Copilot instructions
        run: node --test tools/tests/copilot-instructions.test.mjs
