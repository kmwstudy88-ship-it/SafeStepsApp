name: SafeSteps CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "release-*"

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-output.log

      - name: Expo dependency health
        run: npx expo-doctor

      - name: Route hygiene audit
        run: npm run audit:routes

      - name: Sensitive route permission tests
        run: npx jest __tests__/sensitive-route-permissions.test.ts __tests__/sensitive-audit-metadata.test.ts --runInBand

      - name: Intake and program start gate tests
        run: npx jest __tests__/program-start-gate.test.ts --runInBand

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --json --outputFile=jest-results.json 2>&1 | tee jest-output.log

      - name: Backend tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:backend 2>&1 | tee backend-test-output.log

      - name: Document intelligence API smoke
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:document-intelligence 2>&1 | tee document-smoke-output.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            tsc-output.log
            jest-output.log
            jest-results.json
            backend-test-output.log
            document-smoke-output.log
          if-no-files-found: ignore
          retention-days: 7
