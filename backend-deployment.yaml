apiVersion: apps/v1
kind: Deployment
metadata:
  name: safesteps-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safesteps-backend
  template:
    metadata:
      labels:
        app: safesteps-backend
    spec:
      containers:
        - name: backend
          image: safesteps-backend:latest
          env:
            - name: SAFESTEPS_TRUST_PROXY_HOPS
              value: "1"
            - name: REDIS_URL
              value: redis://safesteps-redis:6379
          ports:
            - containerPort: 3000
