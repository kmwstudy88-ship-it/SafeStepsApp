name: SafeSteps CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Route hygiene audit
        run: npm run audit:routes

      - name: Sensitive route permission tests
        run: npx jest __tests__/sensitive-route-permissions.test.ts __tests__/sensitive-audit-metadata.test.ts --runInBand

      - name: Unit tests
        run: npm test
