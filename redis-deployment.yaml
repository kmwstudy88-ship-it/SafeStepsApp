apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: safesteps-redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safesteps-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: safesteps-redis
  template:
    metadata:
      labels:
        app: safesteps-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: safesteps-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: safesteps-redis
spec:
  selector:
    app: safesteps-redis
  ports:
    - port: 6379
      targetPort: 6379
