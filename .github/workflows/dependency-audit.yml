name: Dependency Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - 'tools/check-npm-audit.mjs'
      - 'tools/tests/dependency-audit.test.mjs'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - 'tools/check-npm-audit.mjs'
      - 'tools/tests/dependency-audit.test.mjs'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tools/tests/dependency-audit.test.mjs
      - name: Fail on high/critical vulnerabilities with compatible fixes
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node tools/check-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"
